aid: africanrainbowminerals
name: African Rainbow Minerals
description: >-
  African Rainbow Minerals Limited (ARM) is a niche, diversified South African mining and minerals
  company, founded by Dr Patrice Motsepe and created in its present form in May 2004 through the
  merger of ARMgold and Harmony assets. ARM is listed on the Johannesburg Stock Exchange under the
  ticker ARI and is headquartered in Sandton, Gauteng. The company mines and beneficiates iron ore,
  manganese ore and alloys, chrome ore, platinum group metals, nickel and coal through ARM Ferrous,
  ARM Platinum and ARM Coal, plus a strategic gold investment in Harmony Gold Mining Company —
  spanning Khumani iron ore, Black Rock manganese, Two Rivers, Modikwa and Bokoni platinum, Nkomati
  nickel, Goedgevonden coal and Sakura Ferroalloys in Malaysia. ARM sells physical mined commodity,
  not software: it runs no developer program and publishes no public API, SDK, webhook or
  machine-readable API contract of any kind.
