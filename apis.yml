  reason: not-a-software-company
  detail: >-
    African Rainbow Minerals is a JSE-listed South African mining house that sells iron ore,
    manganese, chrome, PGMs, nickel and coal, and its only web property is a 30-page WordPress
    corporate/investor site (arm.co.za) whose sitemap contains no developer, docs, portal, API or
    integration page at all; every OpenAPI, Swagger, GraphQL, MCP, llms.txt and agent-card path
    probed on arm.co.za returned a hard 404 with an empty body (a random control path 404s the
    same way, so these are real misses and not an SPA catch-all), no api./dev./docs./developer./
    portal./data./gis./geo./maps. subdomain resolves in DNS on either arm.co.za or
    arm-online.co.za, and the only machine-readable surface on the domain is the stock WordPress
    /wp-json/wp/v2 route index, which describes the CMS that renders the investor site rather
    than any African Rainbow Minerals product, so it was deliberately not registered as a
    contract.
